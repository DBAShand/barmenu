<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🥃 House Spirits – MizzouGlenn’s Tavern</title>
<link rel="stylesheet" href="/static/main.css">
<link rel="stylesheet" href="/static/spirits.css">
</head>
<body class="spirits">
  <header class="menu-header">
    <div class="mizzou-logo split">
  <div class="logo-left">
    <span class="tile"><span>M</span></span>
    <span class="tile"><span>I</span></span>
    <span class="tile"><span>Z</span></span>
    <span class="tile"><span>Z</span></span>
    <span class="tile"><span>O</span></span>
    <span class="tile"><span>U</span></span>
  </div>

  <div class="logo-right">
    <span class="tile"><span>G</span></span>
    <span class="tile"><span>L</span></span>
    <span class="tile"><span>E</span></span>
    <span class="tile"><span>N</span></span>
    <span class="tile"><span>N</span></span>
    <span class="tile"><span>S</span></span>
  </div>
</div>
    <div class="brand-name">Tavern</div>
  </header>

  <div class="board">
    <h1 class="title" id="group-name">Loading...</h1>
    <ul id="spirits"></ul>
    <div class="footer">MizzouGlenn’s Tavern — Where Every Night’s a Home Game</div>
  </div>

  <script>
  const PAGE_SIZE = 10;
  const ROTATE_MS = 12000;

  const groups = {
    "Bourbon": ["bourbon"],
    "Rye": ["rye"],
    "Whiskey": ["whiskey"],
    "Scotch": ["scotch"],
    "Gin": ["gin"],
    "Vodka": ["vodka"],
    "Rum": ["rum"],
    "Liqueurs & Cordials & Aperitifs & Absinthe": [
      "liqueur", "cream liqueur", "orange liqueur", "herbal liqueur",
      "elderflower liqueur", "aperitif", "absinthe"
    ],
    "Tequila / Mezcal": ["tequila", "mezcal"],
  };

  const params = new URLSearchParams(window.location.search);
  const groupParam = params.get("group") || "Bourbon";

  let spiritsData = [];
  let pages = [];
  let pageIndex = 0;
  let rotateTimer = null;

  function chunk(items, size) {
    const out = [];
    for (let i = 0; i < items.length; i += size) out.push(items.slice(i, i + size));
    return out;
  }

  function render(items) {
    const list = document.getElementById('spirits');
    list.innerHTML = items.map(s =>
      `<li>
         <span class="drink">${s.name ?? ""}</span>
         <span class="meta">${s.origin ?? ""}</span>
       </li>`
    ).join('');
  }

  function buildGroupPages(groupName) {
    const types = groups[groupName];
    document.getElementById('group-name').textContent = groupName;

    if (!types) {
      document.getElementById('spirits').innerHTML = `<li>Unknown group</li>`;
      pages = [];
      return;
    }

    const filtered = spiritsData
      .filter(s => {
        const t = (s.type ?? "").toLowerCase();
        return types.some(x => t.includes(x));
      })
      .sort((a, b) => (a.name ?? "").localeCompare(b.name ?? ""));

    pages = chunk(filtered, PAGE_SIZE);
    pageIndex = 0;

    if (rotateTimer) clearInterval(rotateTimer);

    if (pages.length === 0) {
      document.getElementById('spirits').innerHTML = `<li>No spirits in this group</li>`;
      return;
    }

    render(pages[0]);

    if (pages.length > 1) {
      rotateTimer = setInterval(() => {
        pageIndex = (pageIndex + 1) % pages.length;
        render(pages[pageIndex]);
      }, ROTATE_MS);
    }
  }

  async function loadSpiritsOnce() {
    try {
      const res = await fetch('/api/spirits', { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      spiritsData = await res.json();
      buildGroupPages(groupParam);

    } catch (err) {
      document.getElementById('group-name').textContent = 'Error loading spirits';
      document.getElementById('spirits').innerHTML = `<li>Could not load spirits</li>`;
      console.error(err);
    }
  }

  loadSpiritsOnce();
</script>
  <script>
    if (window.self !== window.top) {
      document.body.classList.add('display');
      document.documentElement.classList.add('display');
    }
  </script>
</body>
</html>
