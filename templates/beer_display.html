<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🍺 Beer on Tap – MizzouGlenn’s Tavern</title>
<link rel="stylesheet" href="/static/main.css">
<link rel="stylesheet" href="/static/chalk.css">
<link rel="stylesheet" href="/static/mizzou-vintage.css">
<link rel="stylesheet" href="/static/beer.css">
</head>
<body class="beer">
  <header class="menu-header">
    <div class="mizzou-logo split">
      <div class="logo-left">
        <span class="tile"><span>M</span></span>
        <span class="tile"><span>I</span></span>
        <span class="tile"><span>Z</span></span>
        <span class="tile"><span>Z</span></span>
        <span class="tile"><span>O</span></span>
        <span class="tile"><span>U</span></span>
      </div>

      <div class="logo-right">
        <span class="tile"><span>G</span></span>
        <span class="tile"><span>L</span></span>
        <span class="tile"><span>E</span></span>
        <span class="tile"><span>N</span></span>
        <span class="tile"><span>N</span></span>
        <span class="tile"><span>S</span></span>
      </div>
    </div>
    <div class="brand-name">Tavern</div>
  </header>

  <div class="board">
    <h1 class="title">Beer on Tap</h1>
    <ul id="beer"></ul>
    <div class="footer">MizzouGlenn’s Tavern — Where Every Night’s a Home Game</div>
  </div>

<script>
const PAGE_SIZE = 10;
const ROTATE_MS = 12000;

let beers = [];
let pages = [];
let pageIndex = 0;
let rotateTimer = null;

function chunk(items, size) {
  const out = [];
  for (let i = 0; i < items.length; i += size) {
    out.push(items.slice(i, i + size));
  }
  return out;
}

function render(items) {
  document.getElementById('beer').innerHTML = items.map(b =>
    `<li>
       <span class="drink">
         ${b.name}${b.abv ? ` (${b.abv.toFixed(1)}%)` : ''}
       </span>
       <span class="meta">
         ${b.brewery ? b.brewery + ' • ' : ''}${b.style}
       </span>
     </li>`
  ).join('');
}

async function load() {
  try {
    const res = await fetch('/api/beer', { cache: "no-store" });
    beers = await res.json();

    pages = chunk(beers, PAGE_SIZE);
    if (pages.length === 0) {
      document.getElementById('beer').innerHTML = "<li>No active beers</li>";
      return;
    }

    render(pages[0]);

    rotateTimer = setInterval(() => {
      pageIndex = (pageIndex + 1) % pages.length;
      render(pages[pageIndex]);
    }, ROTATE_MS);

  } catch (err) {
    document.getElementById('beer').innerHTML = "<li>Error loading beer list</li>";
  }
}

load();
</script>

<script>
  if (window.self !== window.top) {
    document.body.classList.add('display');
    document.documentElement.classList.add('display');
  }
</script>

</body>
</html>
