<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🍺 Beer on Tap – MizzouGlenn’s Tavern</title>
<link rel="stylesheet" href="/static/main.css">
<link rel="stylesheet" href="/static/chalk.css">
<link rel="stylesheet" href="/static/mizzou-vintage.css">
<link rel="stylesheet" href="/static/beer.css">
</head>
<body class="beer">
  <header class="menu-header">
<div class="mizzou-logo split">
  <div class="logo-left">
    <span class="tile"><span>M</span></span>
    <span class="tile"><span>I</span></span>
    <span class="tile"><span>Z</span></span>
    <span class="tile"><span>Z</span></span>
    <span class="tile"><span>O</span></span>
    <span class="tile"><span>L</span></span>
  </div>

  <div class="logo-right">
    <span class="tile"><span>G</span></span>
    <span class="tile"><span>L</span></span>
    <span class="tile"><span>E</span></span>
    <span class="tile"><span>N</span></span>
    <span class="tile"><span>N</span></span>
    <span class="tile"><span>S</span></span>
  </div>
</div>
    <div class="brand-name">Tavern</div>
  </header>

  <div class="board">
    <h1 class="title">Beer on Tap</h1>
    <ul id="beer"></ul>
    <div class="footer">MizzouGlenn’s Tavern — Where Every Night’s a Home Game</div>
  </div>

<script src="/static/rotate.js"></script>
<script>
  MenuRotate.startRotation({
    url: "/api/beer",
    listId: "beer",
    pageSize: 10,
    rotateMs: 12000,
    emptyHtml: "<li>No active beers</li>",
    errorHtml: "<li>Error loading beer list</li>",
    renderItem: (b) => `
      <li>
        <span class="drink">
          ${b.name}${b.abv ? ` (${Number(b.abv).toFixed(1)}%)` : ""}
        </span>
        <span class="meta">
          ${b.brewery ? b.brewery + " • " : ""}${b.style ?? ""}
        </span>
      </li>
    `
  });
</script>
<script>
  if (window.self !== window.top) {
    document.body.classList.add('display');
    document.documentElement.classList.add('display');
  }
</script>

</body>
</html>
